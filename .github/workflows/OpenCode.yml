name: PR Review with OpenCode
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Add to PATH
        run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Get PR diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --paginate > diff.json

      - name: Run OpenCode review
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # OpenCode'a mesaj ve diff dosyasını ver
          opencode run -m opencode/big-pickle \
            "Bu PR'daki kod değişikliklerini incele. Hataları, güvenlik açıklarını, performans sorunlarını tespit et. İyileştirme önerileri sun. Sonuçları Markdown formatında yaz." \
            --file diff.json > review.md

          # PR yorumu olarak gönder
          gh pr comment ${{ github.event.pull_request.number }} -F review.md