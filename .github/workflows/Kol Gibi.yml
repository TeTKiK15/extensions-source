name: Build Kol

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure build
        run: |
          sed -i 's/^loadAllIndividualExtensions()/\/\/ loadAllIndividualExtensions()/' settings.gradle.kts
          sed -i 's|^// loadIndividualExtension("all", "mangadex")|loadIndividualExtension("all", "manhuarm")|' settings.gradle.kts
          
      - name: Build APK
        run: ./gradlew src:all:manhuarm:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kolgibi-apk
          path: src/all/manhuarm/build/outputs/apk/debug/*.apk